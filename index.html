<script>
    var bannerBaseUrl = 'https://fish-z-1323797631.cos.ap-beijing.myqcloud.com/site-assets/banner/';
    if (bannerBaseUrl && bannerBaseUrl.charAt(bannerBaseUrl.length - 1) !== '/') {
        bannerBaseUrl += '/';
    }
    var bannerExtension = 'jpg';
    var bannerCount = Number('7');
    var bannerIndex = 0;
    var bannerInterval = Number('5000');
    var activeBannerLayer = 0;

    function bannerUrl(index) {
        return bannerBaseUrl
            ? bannerBaseUrl + index + '.' + bannerExtension
            : "/FISH-Z/medias/banner/" + index + '.jpg';
    }

    function showBanner(index) {
        var nextUrl = bannerUrl(index);
        var image = new Image();
        image.onload = function () {
            var layers = document.querySelectorAll('.about-cover .banner-layer');
            if (!layers.length) return;
            var nextLayer = activeBannerLayer === 0 ? 1 : 0;
            if (index === 0 && !layers[0].style.backgroundImage) nextLayer = 0;
            layers[nextLayer].style.backgroundImage = 'url("' + nextUrl + '")';
            layers[nextLayer].classList.add('is-active');
            if (nextLayer !== activeBannerLayer) layers[activeBannerLayer].classList.remove('is-active');
            activeBannerLayer = nextLayer;
        };
        image.src = nextUrl;
    }

    showBanner(bannerIndex);
    for (var preloadIndex = 1; preloadIndex < bannerCount; preloadIndex++) {
        var preloadImage = new Image();
        preloadImage.src = bannerUrl(preloadIndex);
    }
    if (bannerCount > 1) {
        setInterval(function () {
            bannerIndex = (bannerIndex + 1) % bannerCount;
            showBanner(bannerIndex);
        }, bannerInterval);
    }
</script>

<script>
    $(function () {
        let coverSlider = $('.carousel');

        //用户触摸轮播自动 restartPlay 是否生效
        let initUserPressedOrDraggedActive = false

        //用户触摸轮播自动 restartPlay
        function initUserPressedOrDragged(instance) {
            setInterval(() => {
                if (instance.pressed || instance.dragged) {
                    // console.log('initUserPressedOrDragged: ',instance.pressed,instance.dragged)
                    restartPlay()
                }
            }, 1000)
        }

        coverSlider.carousel({
            duration: Number('120'),
            fullWidth: true,
            indicators: 'true' === 'true',
            onCycleTo() {
                if (!initUserPressedOrDraggedActive) {
                    // console.log('initUserPressedOrDraggedActive')
                    initUserPressedOrDragged(this)
                    initUserPressedOrDraggedActive = true
                }
            },
        })

        let carouselIntervalId;
        
        // Loop to call the next cover article picture.
        let autoCarousel = function () {
            carouselIntervalId = setInterval(function () {
                coverSlider.carousel('next');
            }, 5000);
        };
        autoCarousel();
        

        function restartPlay() {
            
            clearInterval(carouselIntervalId);
            autoCarousel();
            
        };

        
        // prev and next cover post.
        $('#prev-cover').click(function () {
            coverSlider.carousel('prev');
            restartPlay();
        });
        $('#next-cover').click(function () {
            coverSlider.carousel('next');
            restartPlay();
        });
        
    });
</script>
